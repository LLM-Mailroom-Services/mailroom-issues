<circle class="s2 ring" cx="191.2" cy="183.0" r="5"><title>Insurance claims · cheapest API: $0.00051</title></circle>
<text class="val" x="203.2" y="187.0">Modal $0.00054 · Qwen3.7-Flash $0.00051</text>
<text class="lbl" x="152" y="217.0" text-anchor="end">Merger agreements</text>
<line class="conn" x1="423.6" y1="213.0" x2="337.4" y2="213.0"/>
<circle class="s1 ring" cx="423.6" cy="213.0" r="5"><title>Merger agreements · Modal L4: $0.0043</title></circle>
<circle class="s2 ring" cx="337.4" cy="213.0" r="5"><title>Merger agreements · cheapest API: $0.0029</title></circle>
<text class="val" x="433.6" y="217.0">Modal $0.0043 · Qwen3.7-Flash · frozen $0.0029</text>
