<circle class="s2 ring" cx="251.1" cy="93.0" r="5"><title>Contracts · cheapest API: $0.0015</title></circle>
<text class="val" x="306.7" y="97.0">Modal $0.0022 · Qwen3.7-Flash $0.0015</text>
