# Dependabot for mailroom-issues (Actions deps only; no app package manifests).
# Auto-merge: patch/minor via .github/workflows/dependabot-auto-merge.yml.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
