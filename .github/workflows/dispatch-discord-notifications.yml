name: Trigger Discord Issue/Discussion Notifications

# Thin caller — event triggers live here; posting logic is the org reusable workflow.
# Requires repo secret DISCORD_WEBHOOK_URL (or legacy DISCORD_ISSUE_WEBHOOK).

on:
  issues:
    types: [opened, closed, reopened]
  issue_comment:
    types: [created]
  discussion:
    # Actions-documented types (+ answered). "closed" is not a workflow activity
    # type for discussions; use answered / locked for close-like signals.
    types:
      [
        created,
        answered,
        unanswered,
        edited,
        locked,
        unlocked,
        pinned,
        unpinned,
        transferred,
        category_changed,
      ]
  discussion_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  discussions: read

jobs:
  notify-discord:
    uses: LLM-Mailroom-Services/.github/.github/workflows/issues-discussions.yml@main
    secrets: inherit
