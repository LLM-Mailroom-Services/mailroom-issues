name: Discord Issue Alerts

# Self-contained: Discord alerts for mailroom-issues only.
# Triggers: issues opened/closed, discussion created, discussion_comment created.
# Secrets: DISCORD_WEBHOOK_URL (preferred) or DISCORD_ISSUE_WEBHOOK (fallback).
# No org reusable workflow_call — logic lives entirely in this repo.

on:
  issues:
    types: [opened, closed]
  discussion:
    types: [created]
  discussion_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  discussions: read

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Post Discord embed
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ISSUE_WEBHOOK: ${{ secrets.DISCORD_ISSUE_WEBHOOK }}
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_CREATED_AT: ${{ github.event.issue.created_at }}
          ISSUE_CLOSED_AT: ${{ github.event.issue.closed_at }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ', ') }}
          ISSUE_ASSIGNEES: ${{ join(github.event.issue.assignees.*.login, ', ') }}
          DISCUSSION_TITLE: ${{ github.event.discussion.title }}
          DISCUSSION_NUMBER: ${{ github.event.discussion.number }}
          DISCUSSION_URL: ${{ github.event.discussion.html_url }}
          DISCUSSION_BODY: ${{ github.event.discussion.body }}
          DISCUSSION_CATEGORY: ${{ github.event.discussion.category.name }}
          DISCUSSION_CREATED_AT: ${{ github.event.discussion.created_at }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          COMMENT_CREATED_AT: ${{ github.event.comment.created_at }}
        run: |
          python3 <<'PY'
          import json, os, re, time, urllib.error, urllib.request

          webhook = (os.environ.get("DISCORD_WEBHOOK_URL") or "").strip() or (
              os.environ.get("DISCORD_ISSUE_WEBHOOK") or ""
          ).strip()
          if not webhook:
              raise SystemExit(
                  "Missing secret DISCORD_WEBHOOK_URL (or DISCORD_ISSUE_WEBHOOK)"
              )

          event = (os.environ.get("EVENT_NAME") or "").strip()
          action = (os.environ.get("ACTION") or "").strip()
          repo = (os.environ.get("REPO") or "").strip()
          actor = (os.environ.get("ACTOR") or "").strip()
          run_id = (os.environ.get("RUN_ID") or "").strip()
          server_url = (os.environ.get("SERVER_URL") or "https://github.com").rstrip("/")

          # Discord embed limits (keep headroom under hard caps)
          # Hard caps: description 4096, field value 1024, title 256, total ~6000
          DESC_LIMIT = 2000
          FIELD_VALUE_LIMIT = 1024
          BODY_SNIPPET = 600
          TITLE_LIMIT = 200
          MAX_ATTEMPTS = 5

          def pick(*keys: str) -> str:
              for key in keys:
                  val = os.environ.get(key)
                  if val is None:
                      continue
                  val = val.strip()
                  if val:
                      return val
              return ""

          def truncate(text: str, limit: int) -> str:
              if len(text) <= limit:
                  return text
              return text[: max(0, limit - 1)].rstrip() + "…"

          def sanitize_discord(text: str, limit: int) -> str:
              """Make body safe for Discord embed markdown/JSON (stdlib json handles escaping)."""
              if not text:
                  return ""
              # Normalize newlines; strip NUL / other control chars except \t\n\r
              text = text.replace("\r\n", "\n").replace("\r", "\n")
              text = "".join(
                  ch if (ch in "\n\t" or ord(ch) >= 32) else " "
                  for ch in text
              )
              # Soft-break runaway whitespace
              text = re.sub(r"[ \t]+\n", "\n", text)
              text = re.sub(r"\n{4,}", "\n\n\n", text)
              text = text.strip()
              return truncate(text, limit)

          def body_for_embed(raw: str) -> str:
              """Prefer a short Goal/Summary section over dumping full epic markdown."""
              if not raw:
                  return ""
              cleaned = raw.replace("\r\n", "\n").replace("\r", "\n")
              # Prefer ## Goal / ## Summary / ## Overview sections when present
              for heading in ("Goal", "Summary", "Overview", "Problem", "Description"):
                  m = re.search(
                      rf"(?is)^##\s+{re.escape(heading)}\s*\n+(.*?)(?=^##\s+|\Z)",
                      cleaned,
                      re.MULTILINE,
                  )
                  if m:
                      snippet = m.group(1).strip()
                      if snippet:
                          return sanitize_discord(snippet, BODY_SNIPPET)
              # Large bodies (epics): first paragraphs only, never full markdown dump
              if len(cleaned) > BODY_SNIPPET * 2:
                  paras = [p.strip() for p in re.split(r"\n\s*\n", cleaned) if p.strip()]
                  short = "\n\n".join(paras[:2]) if paras else cleaned
                  return sanitize_discord(short, BODY_SNIPPET)
              return sanitize_discord(cleaned, BODY_SNIPPET)

          def field(name: str, value: str, inline: bool = True) -> dict:
              value = value if value else "—"
              value = truncate(value, FIELD_VALUE_LIMIT)
              return {"name": truncate(name, 256), "value": value, "inline": inline}

          if event == "issues":
              title = pick("ISSUE_TITLE")
              number = pick("ISSUE_NUMBER")
              url = pick("ISSUE_URL")
              body = body_for_embed(pick("ISSUE_BODY"))
              category = ""
              event_type = "issue"
              when_utc = (
                  pick("ISSUE_CLOSED_AT")
                  if action == "closed"
                  else pick("ISSUE_CREATED_AT")
              )
              labels_raw = pick("ISSUE_LABELS")
              labels = labels_raw if labels_raw else "none"
              assignees_raw = pick("ISSUE_ASSIGNEES")
              assignees = (
                  ", ".join(f"`{a.strip()}`" for a in assignees_raw.split(",") if a.strip())
                  if assignees_raw
                  else "**Unassigned**"
              )
          elif event == "discussion":
              title = pick("DISCUSSION_TITLE")
              number = pick("DISCUSSION_NUMBER")
              url = pick("DISCUSSION_URL")
              body = body_for_embed(pick("DISCUSSION_BODY"))
              category = pick("DISCUSSION_CATEGORY")
              event_type = "discussion"
              when_utc = pick("DISCUSSION_CREATED_AT")
              labels = "—"
              assignees = "—"
          elif event == "discussion_comment":
              title = pick("DISCUSSION_TITLE")
              number = pick("DISCUSSION_NUMBER")
              url = pick("COMMENT_URL") or pick("DISCUSSION_URL")
              body = sanitize_discord(pick("COMMENT_BODY"), BODY_SNIPPET)
              category = pick("DISCUSSION_CATEGORY")
              event_type = "discussion_comment"
              when_utc = pick("COMMENT_CREATED_AT")
              labels = "—"
              assignees = "—"
          else:
              raise SystemExit(f"Unexpected event: {event}/{action}")

          title = truncate(title, TITLE_LIMIT)

          titles = {
              ("issue", "opened"): "🆕 New Issue",
              ("issue", "closed"): "✅ Closed Issue",
              ("discussion", "created"): "💬 New Discussion",
              ("discussion_comment", "created"): "💬 New Discussion Comment",
          }
          colors = {
              ("issue", "opened"): 0x23AF92,
              ("issue", "closed"): 0x2ECC71,
              ("discussion", "created"): 0x3D94F4,
              ("discussion_comment", "created"): 0x5865F2,
          }
          embed_title = titles.get((event_type, action), "🔔 Notification")
          color = colors.get((event_type, action), 0xCCCCCC)

          # Description: title+number+link, then short body snippet (not full epic)
          head = f"**[#{number} — {title}]({url})**" if (number and url) else (
              f"**#{number} — {title}**" if number else f"**{title}**"
          )
          desc_parts = [head]
          if body:
              desc_parts.append(body)
          description = truncate("\n\n".join(desc_parts), DESC_LIMIT)

          when_display = f"`{when_utc}` (UTC)" if when_utc else "—"
          run_url = f"{server_url}/{repo}/actions/runs/{run_id}" if run_id else ""

          fields = [
              field("Repo", f"`{repo}`"),
              field("Event", f"`{event}` / `{action}`"),
              field("Actor", f"`{actor}`" if actor else "—"),
              field("When (UTC)", when_display),
          ]
          if event_type == "issue":
              # Labels may be long — allow full-width field
              label_value = ", ".join(
                  f"`{n.strip()}`" for n in labels.split(",") if n.strip()
              ) if labels != "none" else "_none_"
              fields.append(field("Labels", label_value or "_none_", inline=False))
              fields.append(field("Assignees", assignees, inline=False))
          if category:
              fields.append(field("Category", f"`{category}`"))
          fields.append(field("Link", f"[Open on GitHub]({url})" if url else "—"))
          if run_url:
              fields.append(field("Workflow run", f"[run `{run_id}`]({run_url})"))

          embed = {
              "title": truncate(embed_title, 256),
              "description": description,
              "color": color,
              "fields": fields[:25],
          }
          if url:
              embed["url"] = url
          if when_utc:
              embed["timestamp"] = when_utc

          payload = {
              "username": "mailroom-ops-bot",
              "avatar_url": "https://i.imgur.com/CsZ3mRy.png",
              "embeds": [embed],
          }

          data = json.dumps(payload).encode("utf-8")
          headers = {
              "Content-Type": "application/json",
              "User-Agent": (
                  "DiscordBot "
                  "(https://github.com/LLM-Mailroom-Services/mailroom-issues, 1.0)"
              ),
          }

          last_err = ""
          for attempt in range(1, MAX_ATTEMPTS + 1):
              req = urllib.request.Request(
                  webhook, data=data, headers=headers, method="POST"
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      # Never log webhook URL or secret material
                      print(
                          f"Discord webhook OK status={resp.status} attempt={attempt}"
                      )
                      break
              except urllib.error.HTTPError as e:
                  err_body = e.read().decode("utf-8", errors="replace")
                  last_err = f"status={e.code} body={err_body}"
                  # Retry rate limits and transient gateway errors
                  if e.code == 429 or e.code in (500, 502, 503, 504):
                      retry_after = 1.0 * attempt
                      try:
                          parsed = json.loads(err_body) if err_body else {}
                          ra = parsed.get("retry_after")
                          if ra is not None:
                              retry_after = max(float(ra), 0.25)
                      except (ValueError, TypeError, json.JSONDecodeError):
                          hdr = e.headers.get("Retry-After") if e.headers else None
                          if hdr:
                              try:
                                  retry_after = max(float(hdr), 0.25)
                              except ValueError:
                                  pass
                      # Cap wait; add small jitter via attempt multiplier floor
                      retry_after = min(retry_after + (0.1 * attempt), 10.0)
                      print(
                          f"Discord webhook retryable {last_err}; "
                          f"sleep={retry_after:.2f}s attempt={attempt}/{MAX_ATTEMPTS}"
                      )
                      if attempt < MAX_ATTEMPTS:
                          time.sleep(retry_after)
                          continue
                  raise SystemExit(
                      f"Discord webhook failed {last_err} attempt={attempt}"
                  ) from None
          else:
              raise SystemExit(
                  f"Discord webhook failed after {MAX_ATTEMPTS} attempts {last_err}"
              )
          PY
